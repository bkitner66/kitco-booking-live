<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<meta name="robots" content="noindex, nofollow">
<title>Book an Appointment</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Figtree:wght@400&display=swap" rel="stylesheet">
<style>
  /* Serif: ITC Bodoni Seventy-Two (the face Apple ships as "Bodoni 72").
     iPhone/iPad/Mac use the built-in Bodoni 72; Windows uses the installed ITC Bodoni Seventy-Two Pro
     (by family name: Chrome's local() can't see per-user fonts); everything else gets Prata. */
  @font-face {
    font-family: "Bodoni72";
    src: local("BodoniSvtyTwoITCTT-Book"), local("Bodoni 72 Book");
    font-weight: 400;
    font-display: swap;
  }
  @font-face {
    font-family: "Bodoni72";
    src: local("BodoniSvtyTwoITCTT-Bold"), local("Bodoni 72 Bold");
    font-weight: 700;
    font-display: swap;
  }
  /* Devices without Bodoni 72 (e.g. Android) get Prata, scaled to take the same width. */
  @font-face {
    font-family: "PrataFit";
    src: url("https://fonts.gstatic.com/s/prata/v22/6xKhdSpbNNCT-sWPCm4.woff2") format("woff2");
    size-adjust: 79%;
    font-display: swap;
  }

  :root {
    --serif: "Bodoni72", "Bodoni 72", "Bodoni Svntytwo ITC Pro Book", "PrataFit", Georgia, serif;
    --sans: "Lato", system-ui, -apple-system, sans-serif;
    --ink: #0e1a45;
    --text: #13235a;
    --muted: #4c62a4;
    --step: #2c4a8c;
    --teal: #167a96;
    --blue: #1380a8;
    --blue-deep: #0a7bab;
    --line: #d4e7ee;
    --track: #d7dce5;
    --header: #2c3748;
    --error: #c0392b;
    --status-h: 53px;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: #eef0f3; color: var(--text); font-family: var(--sans);
    -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }

  .serif {
    font-family: var(--serif); font-weight: 400; color: var(--ink);
    font-variant-numeric: lining-nums; letter-spacing: -.01em;
  }

  /* ---------- Device frame (desktop preview) ---------- */
  .stage { min-height: 100%; display: flex; align-items: center; justify-content: center; padding: 32px 16px; }
  .device {
    position: relative; width: 417px; height: 936px; padding: 12px; flex: none;
    border-radius: 68px; background: #0b0b0c;
    box-shadow: 0 0 0 2px #3a3a3c, 0 0 0 4px #121213, 0 40px 80px rgba(15, 24, 64, .18);
  }
  .screen { position: relative; width: 100%; height: 100%; border-radius: 56px; overflow: hidden; background: #fff; }
  .island {
    position: absolute; top: 11px; left: 50%; transform: translateX(-50%); z-index: 3;
    width: 124px; height: 34px; border-radius: 20px; background: #000;
  }
  .statusbar {
    position: absolute; inset: 0 0 auto; height: var(--status-h); z-index: 2; background: #fff;
    display: flex; align-items: center; justify-content: space-between; padding: 2px 26px 0 41px;
    font: 600 16.5px/1 -apple-system, "SF Pro Text", "Segoe UI", system-ui, sans-serif; color: #000;
  }
  .statusbar .icons { display: flex; align-items: center; gap: 6px; }
  .scroller {
    position: absolute; inset: var(--status-h) 0 0; overflow-y: auto; overscroll-behavior: contain;
    scrollbar-width: none;
  }
  .scroller::-webkit-scrollbar { display: none; }

  /* Screenshot mode (?shot): the bare 393pt screen with status bar, no bezel */
  .shot body { background: #fff; }
  .shot .stage { padding: 0; display: block; }
  .shot .device { width: 393px; height: 100vh; padding: 0; border-radius: 0; box-shadow: none; background: #fff; }
  .shot .screen { border-radius: 0; }

  /* Real phones: full screen, the OS draws its own status bar */
  /* ---------- Phones (up to 599px): full screen ---------- */
  @media (max-width: 599px) {
    html:not(.shot) body { background: #fff; }
    html:not(.shot) .stage { padding: 0; display: block; }
    html:not(.shot) .device { width: 100%; height: 100dvh; padding: 0; border-radius: 0; background: #fff; box-shadow: none; }
    html:not(.shot) .screen { border-radius: 0; }
    html:not(.shot) .island, html:not(.shot) .statusbar { display: none; }
    html:not(.shot) .scroller { inset: 0; }
    html:not(.shot) .app { padding-top: env(safe-area-inset-top); }
    html:not(.shot) .app.has-topbar { padding-top: 0; }
    html:not(.shot) .topbar { padding-top: env(safe-area-inset-top); height: calc(53px + env(safe-area-inset-top)); }
    /* the Kitco bar only shows on step 1 on phones */
    html:not(.shot) .app:not(.has-topbar) .topbar { display: none; }
  }

  /* ---------- Site banner: Kitco bar + photo with title and EN/FR (tablet & desktop only) ---------- */
  .site-head { display: none; position: relative; }
  @media (min-width: 600px) {
    html:not(.shot) .topbar { display: none; }
    html:not(.shot) .site-head { display: block; }
    html:not(.shot) main.s1 .page-title { display: none; }
    html:not(.shot) main.s1 .step-label { margin-top: 0; }
    /* steps 2-4: only the thin Kitco bar, so the booking card can be larger; EN/FR moves into the bar */
    html:not(.shot) .app:not(.has-topbar) .hero { display: none; }
    html:not(.shot) .app:not(.has-topbar) .lang {
      top: calc((clamp(38px, 2.9cqw, 68px) - clamp(32px, 2.55cqw, 53px) * .8) / 2);
      transform: scale(.8); transform-origin: right top;
    }
  }
  .app { container-type: inline-size; }
  .site-bar { background: #1f2f3e; height: clamp(38px, 2.9cqw, 68px); display: flex; align-items: center; padding-left: clamp(18px, 1.76cqw, 38px); }
  .site-logo { display: flex; align-items: flex-end; width: clamp(140px, 12.7cqw, 280px); }
  .site-logo svg { height: auto; display: block; }
  .site-logo .ic-mark { width: 31.8%; }
  .site-logo .kw { width: 58.3%; margin-left: 3.5%; }
  .site-logo .reg { width: 5.7%; margin-left: .6%; align-self: flex-start; }
  .hero {
    position: relative; min-height: clamp(112px, 10.6cqw, 226px); padding: clamp(15px, 1.65cqw, 36px) 24px clamp(14px, 1.5cqw, 33px);
    background: #2c3846 url("assets/counter.jpg") center / cover no-repeat; color: #fff; text-align: center;
    display: flex; flex-direction: column; justify-content: center;
  }
  .hero-title { text-wrap: balance; color: #fff !important; font-size: clamp(24px, 3cqw, 63px); line-height: 1.12; margin: 0; letter-spacing: 0 !important; text-shadow: 0 1px 12px rgba(0, 0, 0, .25); }
  .hero-sub { text-wrap: balance; font: 400 clamp(14px, 1.92cqw, 41px)/1.3 "Figtree", var(--sans); margin: .45em 0 0; color: #f4f6f8; text-shadow: 0 1px 10px rgba(0, 0, 0, .25); }
  .lang {
    position: absolute; top: calc(clamp(38px, 2.9cqw, 68px) + clamp(10px, 1.2cqw, 26px)); right: clamp(14px, 2.44cqw, 55px); display: flex; z-index: 1;
    background: #f4f6f7; border-radius: clamp(6px, .45cqw, 9px); padding: 2px; box-shadow: 0 2px 10px rgba(0, 0, 0, .18);
  }
  .lang button {
    border: 0; background: none; cursor: pointer; font: 700 clamp(13px, 1.1cqw, 22px)/1 var(--sans); color: #1b8db1;
    width: clamp(44px, 3.55cqw, 78px); height: clamp(32px, 2.55cqw, 53px); border-radius: clamp(5px, .38cqw, 7px);
    transition: background-color .2s ease, color .2s ease, box-shadow .2s ease;
  }
  .lang button.active { background: #fff; color: #2b3644; box-shadow: 0 0 0 1px #dfe4e8, 0 1px 3px rgba(0, 0, 0, .12); }
  .lang button:not(.active):hover { color: #0d6f8f; }

  /* Phones: compact banner on step 1 only, EN/FR in the bar */
  @media (max-width: 599px) {
    html:not(.shot) .topbar { display: none; }
    html:not(.shot) .app.has-topbar .site-head { display: block; }
    html:not(.shot) main.s1 .page-title { display: none; }
    html:not(.shot) main.s1 .step-label { margin-top: 10px; }
    /* step 1: tighter spacing so the text can grow into the freed space (see fill()) */
    html:not(.shot) .hero { padding: 10px 16px 11px; }
    /* one shorter title that includes the address, no subtitle */
    html:not(.shot) .hero-sub, html:not(.shot) .hero-title .for-desk { display: none; }
    html:not(.shot) .hero-title { font-size: 20px; line-height: 1.18; }
    html:not(.shot) .s1 h2.section { margin: 12px 0 6px; }
    html:not(.shot) .s1 h2.section.second { margin: 8px 0 6px; }
    html:not(.shot) .s1 .card { margin-bottom: 6px; }
    html:not(.shot) .s1 .card.intent { height: 64px; }
    html:not(.shot) .s1 .card .ic-cart { top: 16px; }
    html:not(.shot) .s1 .card .ic-box { top: 13.5px; }
    html:not(.shot) .s1 .card.duration { padding: 5px 0 6px; }
    html:not(.shot) .s1 .card .desc { font-size: 14px; line-height: 16.5px; }
    html:not(.shot) .btn.s1 { margin-top: 8px; }
    html:not(.shot) main.s1 { padding-bottom: calc(env(safe-area-inset-bottom) + 10px); }
    .site-bar { height: calc(53px + env(safe-area-inset-top)); padding: env(safe-area-inset-top) 0 0 17px; }
    .site-logo { width: 122px; }
    .hero { min-height: 0; padding: 18px 18px 20px; }
    .hero-title { font-size: 23px; line-height: 1.15; }
    .hero-sub { font-size: 14px; margin-top: 6px; }
    .lang { top: calc(env(safe-area-inset-top) + 11.5px); right: 12px; padding: 2px; border-radius: 7px; }
    .lang button { width: 38px; height: 26px; font-size: 12px; border-radius: 5px; }
  }

  /* transaction value and Kitco account question share a row */
  /* label / control / error rows are shared (subgrid) so the box and the Yes/No line up even when a label wraps */
  .field.pair-row { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: auto auto auto; column-gap: 14px; }
  .field.pair-row > .field { margin-top: 0; min-width: 0; display: grid; grid-row: span 3; grid-template-rows: subgrid; }
  .pair-row .label { align-self: end; }
  .pair-row .radios { margin-top: 0; height: 33px; align-items: center; }
  .pair-row .radios label { width: auto; margin-right: 22px; }

  /* Phones: steps 1 and 3 grow (via --k) to use the free space down to the button */
  @media (max-width: 599px) {
    html:not(.shot) main.s1 .cols, html:not(.shot) main.s3 .cols { display: flex; flex-direction: column; zoom: var(--k, 1); }
  }

  /* ---------- Kitco site menu (same contents as the online.kitco.com hamburger) ---------- */
  .site-menu { background: none; border: 0; padding: 6px; margin: 0 clamp(10px, 1.1cqw, 22px) 0 -6px; display: flex; cursor: pointer; }
  .site-menu svg { width: clamp(22px, 1.76cqw, 38px); height: auto; }
  .kmenu { position: fixed; inset: 0; z-index: 50; visibility: hidden; font-family: Arial, Helvetica, sans-serif; }
  .kmenu.open { visibility: visible; }
  .km-backdrop { position: absolute; inset: 0; background: rgba(0, 0, 0, .5); opacity: 0; transition: opacity .25s ease; }
  .kmenu.open .km-backdrop { opacity: 1; }
  .km-panel {
    position: absolute; inset: 0 auto 0 0; width: min(400px, 100vw); background: #fff; display: flex; flex-direction: column;
    transform: translateX(-100%); transition: transform .25s ease; box-shadow: 0 0 24px rgba(0, 0, 0, .2);
  }
  .kmenu.open .km-panel { transform: none; }
  .km-head { background: #293343; color: #fff; font-size: 14px; padding: calc(16px + env(safe-area-inset-top)) 16px 16px 20px; display: flex; align-items: center; gap: 12px; flex: none; }
  .km-head > div { flex: 1; }
  .km-head a { color: #ebbc4e; text-decoration: none; }
  .km-close { background: none; border: 0; color: #fff; width: 32px; height: 32px; padding: 0; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .km-pages { position: relative; flex: 1; overflow: hidden; }
  .km-page { position: absolute; inset: 0; overflow-y: auto; padding: 8px 20px 32px; transition: transform .25s ease; background: #fff; }
  .km-sub { transform: translateX(100%); padding-top: 0; }
  .kmenu.sub .km-main { transform: translateX(-30%); }
  .kmenu.sub .km-sub { transform: none; }
  .km-page a { color: #333; text-decoration: none; }
  .km-h { display: block; font-weight: 700; font-size: 18px; padding: 8px 0; }
  .km-page hr { border: 0; border-top: 1px solid #f4f4f7; margin: 4px 0; }
  .km-page ul { list-style: none; margin: 0 0 6px; padding: 0; }
  .km-page li > a, .km-page li > button { display: flex; justify-content: space-between; align-items: center; width: 100%; font: 400 16px/1.25 Arial, Helvetica, sans-serif; color: #333; padding: 7px 0; background: none; border: 0; text-align: left; cursor: pointer; }
  .km-page li > button::after { content: "›"; font-size: 22px; line-height: 1; color: #777; }
  .km-page a.deal { color: #cf4055; }
  .km-page a:hover, .km-page li > button:hover { color: #0a7bab; }
  .km-back { position: sticky; top: 0; background: #f4f4f7; margin: 0 -20px 8px; padding: 12px 20px; }
  .km-back button { background: none; border: 0; padding: 0; font: 700 16px Arial, Helvetica, sans-serif; color: #333; cursor: pointer; display: flex; align-items: center; gap: 8px; }
  .km-group { font-weight: 700; font-size: 16px; padding: 10px 0 2px; display: block; }

  .hero-title .for-phone { display: none; }
  @media (max-width: 599px) { html:not(.shot) .hero-title .for-phone { display: inline; } }

  /* ---------- Live availability states ---------- */
  .slots-note { font-size: 14px; color: #4f5c86; margin: 4px 0 0; line-height: 1.4; }
  .slots-note button { background: none; border: 0; padding: 0; color: var(--teal); text-decoration: underline; font: inherit; cursor: pointer; }
  .loading .day { opacity: .45; }
  .slots.many { max-height: calc(6 * 36px + 5 * 8px); overflow-y: auto; padding-right: 2px; }
  .book-error { color: var(--error); font-size: 13px; margin: 8px 0 0; text-align: center; }
  .btn.busy { opacity: .7; cursor: progress; }
  .demo-badge {
    position: fixed; z-index: 40; top: 6px; left: 50%; transform: translateX(-50%);
    background: #ebbc4e; color: #1f2f3e; font: 700 11px/1 var(--sans); letter-spacing: .02em;
    padding: 5px 10px; border-radius: 99px; box-shadow: 0 1px 4px rgba(0, 0, 0, .2); pointer-events: none;
  }
  .demo-badge[hidden] { display: none; }
  .demo-badge .short { display: none; }
  @media (max-width: 599px) {
    .demo-badge { left: auto; right: 98px; top: calc(env(safe-area-inset-top) + 17px); transform: none; padding: 5px 8px; }
    .demo-badge .long { display: none; }
    .demo-badge .short { display: inline; }
  }
  @media (min-width: 960px) { html:not(.shot) .s2 .slots.many { max-height: calc(8 * 44px + 7 * 8px); } }

  /* layout wrappers only matter on larger screens */
  .cols, .col, .step-head, .step-left { display: contents; }

  /* ---------- Tablet & desktop (600px and up): a page with the Kitco bar and a centred card ---------- */
  @media (min-width: 600px) {
    html:not(.shot) body { background: #eef1f5; }
    html:not(.shot) .stage { display: block; padding: 0; }
    html:not(.shot) .device { width: auto; height: 100vh; height: 100dvh; padding: 0; border-radius: 0; background: none; box-shadow: none; }
    html:not(.shot) .screen { border-radius: 0; background: none; }
    html:not(.shot) .island, html:not(.shot) .statusbar { display: none; }
    html:not(.shot) .scroller { inset: 0; }
    html:not(.shot) .app.has-topbar, html:not(.shot) .app { padding-top: 0; }
    html:not(.shot) .topbar .bar { width: min(960px, 100% - 48px); margin: 0 auto; }
    html:not(.shot) .topbar .menu { left: -4px; }
    html:not(.shot) .topbar .mark { left: 39.4px; }
    html:not(.shot) .topbar .word { left: 82.5px; }
    html:not(.shot) .topbar .reg { left: 154.4px; }
    html:not(.shot) main {
      flex: none; width: min(560px, 100% - 48px); margin: 32px auto;
      background: #fff; border-radius: 12px; box-shadow: 0 1px 2px rgba(20, 30, 60, .06), 0 12px 32px rgba(20, 30, 60, .08);
      padding: 28px 32px 30px;
    }
    html:not(.shot) main.s1 .page-title { margin-top: 0; }
    html:not(.shot) .grow { flex: none; height: 22px; min-height: 0; }
    html:not(.shot) main.s3 .btn.s3 { margin-top: 6px; }
    html:not(.shot) .card, html:not(.shot) .slot, html:not(.shot) .day:not(:disabled) { cursor: pointer; }
    html:not(.shot) .card:hover { border-color: #9fcfe0; }
    html:not(.shot) .slot:not(:disabled):not(.on):hover { border-color: #7fbfd6; }
    html:not(.shot) main.s4 { width: min(480px, 100% - 48px); }
    html:not(.shot) .slots { grid-template-columns: repeat(3, 1fr); column-gap: 8px; }
    html:not(.shot) .done { padding: 24px 0 8px; }
  }

  /* ---------- Desktop (960px and up): two columns ---------- */
  @media (min-width: 960px) {
    html:not(.shot) main { width: calc(1248px / var(--dk, 1)); padding: 34px 48px 34px; margin: 26px auto; zoom: var(--dk, 1); }
    html:not(.shot) .grow { height: 18px; }
    html:not(.shot) .page-title { font-size: 36px; line-height: 42px; }
    html:not(.shot) h1.title { font-size: 34px; line-height: 40px; }
    html:not(.shot) h2.section { font-size: 24px; line-height: 28px; }
    html:not(.shot) .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 48px; align-items: start; }
    html:not(.shot) .col { display: block; min-width: 0; }
    html:not(.shot) .s1 .cols { margin-top: 24px; }
    html:not(.shot) .s1 h2.section, html:not(.shot) .s1 h2.section.second { margin: 0 0 12px; }
    /* Step 1: the card is as wide as the other steps; content stays 864px wide and centred. */
    html:not(.shot) main.s1 { padding-left: calc(114px / var(--dk, 1)); padding-right: calc(114px / var(--dk, 1)); }
    html:not(.shot) .s1 h2.section, html:not(.shot) .s1 h2.section.second { font-size: calc(44.8px / var(--dk, 1)); line-height: 1.15; margin: 0 0 12px; }
    html:not(.shot) .s1 .cols { margin-top: 8px; }
    /* the French duration question is much longer: keep it on one line */
    html:lang(fr):not(.shot) .s1 h2.section.second { font-size: 28px; white-space: nowrap; }
    html:not(.shot) .s1 .card .name { font-size: calc(28px / var(--dk, 1)); line-height: 1.15; }
    html:not(.shot) .s1 .card.intent { height: auto; min-height: 70px; padding: 10px 14px 12px 0; }
    html:not(.shot) .s1 .card.duration { padding: 9px 14px 11px 0; }
    html:not(.shot) .s1 .card .ic-cart, html:not(.shot) .s1 .card .ic-box { top: 50%; transform: translateY(-50%); }
    /* descriptions match the size of step 3's placeholder text (13.1px at step 3's 1.5 scale) */
    html:not(.shot) .s1 .card .desc, html:not(.shot) .s1 .card.intent .desc { font-size: calc(19.6px / var(--dk, 1)); line-height: 1.3; max-width: none; margin-top: 3px; }
    html:not(.shot) .s2 .cols { margin-top: 24px; grid-template-columns: 1.3fr 1fr; }
    html:not(.shot) .s2 .calendar { padding: 18px 6px 8px; }
    html:not(.shot) .s2 .cal-head { padding: 0 8px 14px 20px; }
    html:not(.shot) .s2 .cal-head h3 { font-size: 26px; line-height: 30px; }
    html:not(.shot) .s2 .dow { font-size: 14px; padding-bottom: 12px; }
    html:not(.shot) .s2 .day { height: 52px; font-size: 18px; }
    html:not(.shot) .s2 .day .num { width: 40px; height: 34px; }
    html:not(.shot) .s2 .day.on .num, html:not(.shot) .s2 .day:not(:disabled):not(.on):hover .num { height: 40px; margin: -3px 0; }
    html:not(.shot) .s2 .day .dot { width: 5px; height: 5px; }
    html:not(.shot) .s2 .day.on .dot { margin-top: 7px; }
    html:not(.shot) .s2 .col h2.section { font-size: 28px; line-height: 32px; margin-bottom: 16px; }
    html:not(.shot) .s2 .slot { height: 44px; font-size: 15px; }
    /* desktop: 4 times per row, up to 8 rows (32 times) without scrolling */
    html:not(.shot) .s2 .slots { grid-template-columns: repeat(4, 1fr); }
    html:not(.shot) .s2 .col h2.section { margin-top: 0; }
    html:not(.shot) .s3 .cols { margin-top: 22px; align-items: center; }
    html:not(.shot) .step-head { display: grid; grid-template-columns: auto 1fr; column-gap: 54px; align-items: start; }
    html:not(.shot) .step-left { display: block; }
    html:not(.shot) .step-head h1.title { margin: 0; align-self: start; font-size: 38px; line-height: 44px; }
    html:not(.shot) .s3 .summary { margin-top: 0; }
    html:not(.shot) main.s3 .btn.s3 { margin-top: 10px; }
    html:not(.shot) .btn.s1, html:not(.shot) .btn.s2 { width: 260px; align-self: flex-end; }
    html:not(.shot) main.s4 { width: min(520px, 100% - 48px); }
  }

  .app { min-height: 100%; display: flex; flex-direction: column; }
  /* While measuring the natural height, let spacers collapse */
  .app.measure { min-height: 0; }
  .app.measure .grow { flex: 0 0 auto; }
  .alt-serif .serif, .alt-serif .serif * { letter-spacing: -.025em !important; }
  main { flex: 1; display: flex; flex-direction: column; padding: 0 19px calc(env(safe-area-inset-bottom) + 14px); }

  .progress.full { width: 100%; gap: 5px; }
  .progress i { flex: 1; height: 7px; border-radius: 4px; background: var(--track); }
  .progress i.on { background: var(--teal); }

  .back {
    display: inline-flex; align-items: center; gap: 10px; align-self: flex-start;
    background: none; border: 0; padding: 0; color: var(--teal); font-size: 19.5px; line-height: 24px;

  /* ---------- Step 1 ---------- */
  .s1 .step-label { margin-top: 10px; }
  .s1 h2.section { margin: 18px 0 8px; }
  .s1 .card.duration:last-child { margin-bottom: 0; }
  .s1 h2.section.second { margin-top: 10px; margin-bottom: 8px; }
  .card {
    width: 100%; text-align: left; background: #fff; color: inherit;
    border: 1px solid var(--line); border-radius: 6px; margin-bottom: 8px;
    display: grid; transition: border-color .15s, background .15s; padding: 0;
  }
  .card.intent { grid-template-columns: 78px 1fr; height: 70px; align-items: center; }
  .card.duration { grid-template-columns: 60px 1fr; align-items: start; padding: 7px 0 8px; }
  .card .icon { position: relative; align-self: stretch; }
  .card .icon svg { position: absolute; }
  .card .ic-cart { left: 20px; top: 19px; }
  .card .ic-box { left: 22px; top: 16.5px; }
  .card .name { display: flex; align-items: center; gap: 12px; font-size: 21px; line-height: 24px; letter-spacing: -.05em; }
  .card .desc { display: block; font-size: 13.2px; line-height: 16px; font-weight: 300; color: var(--muted); }
  .card.intent .desc { margin-top: 3px; max-width: 200px; }
  .card.duration .desc { margin-top: 1px; padding-right: 14px; }
  .card.intent > span:last-child { padding-top: 1px; }

  .tick {
    width: 24px; height: 24px; flex: none; border: 2.5px solid var(--teal); border-radius: 5px;
    display: inline-flex; align-items: center; justify-content: center; background: #fff; transition: background .15s;
  }
  .tick svg { opacity: 0; }
  .card.on .tick { background: var(--teal); }
  .card.on .tick svg { opacity: 1; }

  .dot-radio {
    width: 22px; height: 22px; flex: none; border: 2.5px solid #056f8e; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center; margin: 3px 0 0 18px;
  }
  .dot-radio::after { content: ""; width: 10px; height: 10px; border-radius: 50%; background: #056f8e; transform: scale(0); transition: transform .15s; }
  .card.on .dot-radio { border-color: #056f8e; }
  .card.on .dot-radio::after { transform: scale(1); }

  /* ---------- Buttons ---------- */
  .grow { flex: 1; }
  .btn {
    width: 100%; border: 0; background: var(--teal); color: #fff; flex: none;
    transition: filter .15s, opacity .15s;
  }
  .btn:active { filter: brightness(.9); }
  .btn:disabled { cursor: not-allowed; opacity: .4; }
  .btn.s1 { height: 42px; border-radius: 5px; font-size: 17px; font-weight: 700; margin-top: 10px; }
  .btn.s2 { height: 46px; border-radius: 6px; font-size: 18.5px; font-weight: 400; }
  .btn.s3 { height: 42px; border-radius: 5px; font-size: 16px; font-weight: 400; background: var(--blue); }
  .btn.s4 { height: 46px; border-radius: 6px; font-size: 18px; font-weight: 300; background: var(--blue-deep); }

  /* ---------- Step 2 ---------- */
  /* Steps 2 and 3 share the same header block, so Back sits in exactly the same place */
  .s2 .step-label, .s3 .step-label { margin-top: 0; margin-bottom: 3px; }
  .s2 .back, .s3 .back { margin-top: 10px; color: #08607c; }
  .s2 h1.title { margin: 14px 0 12px; }
  .calendar { border: 1.1px solid #aad8e7; border-radius: 6px; padding: 11px 0 2px; overflow: hidden; }
  .cal-head { display: flex; align-items: center; padding: 0 5px 9px 16px; }
  .cal-head h3 { font-size: 20px; line-height: 24px; margin: 0; flex: 1; letter-spacing: -.03em; }
  .cal-head button { background: none; border: 0; padding: 0; width: 46px; height: 26px; display: flex; align-items: center; justify-content: center; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; padding: 0 2px; }
  .dow { font-size: 12px; line-height: 14px; color: #4a5e9b; padding-bottom: 8px; }
  .day {
    background: none; border: 0; padding: 0; height: 33px; color: #1a2140; font-size: 13.4px;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
  }
  .day .num { width: 31px; height: 21px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
  .day.on .num { height: 31px; margin: -5px 0 -5px; background: var(--teal); color: #fff; }
  .day .dot { width: 4px; height: 4px; border-radius: 50%; background: var(--teal); margin-top: 3px; }
  .day:disabled { cursor: default; }
  .day:disabled .dot { visibility: hidden; }
  .day.on .dot { margin-top: 6px; }
  .day:not(:disabled):not(.on):hover .num { background: #eaf5f8; height: 31px; margin: -5px 0; }
  .s2 h2.section { margin: 16px 0 10px; }
    .slots { display: grid; grid-template-columns: 116px 112px 112px; justify-content: space-between; row-gap: 8px; }
  .slot { height: 36px; border: 1.1px solid #b3dcea; border-radius: 5px; background: #fff; font-size: 14px; color: #1a2140; padding: 0; white-space: nowrap; }
  .slot.on { background: var(--teal); border-color: var(--teal); color: #fff; }
  .slot:disabled { color: #b6bccb; cursor: default; }
  .s2 .grow { min-height: 14px; }

  /* ---------- Step 3 ---------- */
  .s3 h1.title { margin: 8px 0 10px; }
  .field + .field { margin-top: 9px; }
  .field.gap { margin-top: 11px; }
  .label { display: block; font-size: 12px; line-height: 14px; color: #0f1a3d; margin: 0 0 4px; }
  label[for="notes"] { margin-bottom: 4px; }
  .box {
    display: flex; align-items: center; height: 36px; border: 1.2px solid #a6d6e6; border-radius: 5px; background: #fff;
    transition: border-color .15s, box-shadow .15s;
  }
  .box:focus-within { border-color: var(--teal); box-shadow: 0 0 0 3px rgba(21, 122, 149, .12); }
  .box input, .box textarea { border: 0; outline: 0; background-color: transparent; min-width: 0; }
  .box input { width: 100%; height: 100%; padding: 0 13px; font-size: 13.1px; color: var(--text); }
  .box .lead { width: 46px; flex: none; display: flex; }
  .box .lead .ic-user { margin-left: 11px; }
  .box .lead .ic-mail { margin-left: 10px; }
  .box .lead + input { padding-left: 0; }
  .box.short { height: 34px; }
  .box.shorter { height: 33px; }
  .box .plus { flex: none; padding-left: 13px; font-size: 13.5px; color: #0f1a3d; }
  .box .cc { height: 100%; width: 46px; flex: none; padding: 0 6px 0 1px; font-size: 13.5px; color: #0f1a3d; }
  .box .vsep { width: 1.2px; height: 21px; background: #b7bfd1; flex: none; }
  .box .vsep + input { padding-left: 13px; }
  .box.area { height: auto; align-items: stretch; }
  .box textarea { width: 100%; height: 83px; padding: 7px 12px; font-size: 13.1px; line-height: 17px; resize: none; color: var(--text); }
  ::placeholder { color: #5b72aa; opacity: 1; }
  .box textarea::placeholder { color: #8b9bc4; font-weight: 300; }
  .err { font-size: 11.5px; color: var(--error); margin-top: 5px; display: none; }
  .invalid .box { border-color: var(--error); }
  .invalid .err { display: block; }

  .radios { display: flex; margin-top: 5px; }
  .radios label { display: flex; align-items: center; gap: 12px; font-size: 13px; color: #0f1a3d; width: 82px; height: 22px; cursor: pointer; }
  .radios input, .checks input { position: absolute; opacity: 0; pointer-events: none; }
  .ring { width: 20px; height: 20px; border: 1.6px solid #263a6d; border-radius: 50%; flex: none; display: flex; align-items: center; justify-content: center; }
  .ring::after { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--teal); transform: scale(0); transition: transform .2s ease; }
  .radios input:checked + .ring { border-color: var(--teal); }
  .radios input:checked + .ring::after { transform: scale(1); }
  .radios input:focus-visible + .ring, .checks input:focus-visible + .sq { outline: 2px solid var(--teal); outline-offset: 2px; }

  .summary {
    border: 1.2px solid #a6d2e2; border-radius: 5px; padding: 7px 8px 7px 0; margin: 11px 0 10px;
    display: grid; grid-template-columns: 76px 1fr;
  }
  .summary { position: relative; }
  .summary .icon > svg { position: absolute; left: 13.5px; top: 16px; }
  .summary .icon .pair { position: absolute; left: 0; top: 0; bottom: 0; width: 76px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; }
  .summary .headline { font-size: 17px; line-height: 21px; margin-bottom: 1px; letter-spacing: -.045em; }
  .summary .sep { margin: 0 8px; }

  .summary .row .ic-pin { margin: 0 .7px; }
  .summary .row .sep { margin: 0 7px; }

  .checks label { display: flex; align-items: center; gap: 12px; font-size: 12.7px; font-weight: 400; color: var(--muted); min-height: 19px; margin-bottom: 7px; cursor: pointer; }
  .sq { width: 19px; height: 19px; flex: none; border: 1.6px solid #4a5d93; border-radius: 2px; display: flex; align-items: center; justify-content: center; transition: background-color .2s ease, border-color .2s ease; }

  .checks a { color: var(--teal); text-underline-offset: 2px; }
  .checks .invalid .sq { border-color: var(--error); }
  .call { display: flex; align-items: center; gap: 14.7px; font-size: 12.4px; font-weight: 400; color: var(--muted); margin: 6px 0 10px; }

  .call a { color: inherit; text-decoration: none; }

  /* ---------- Colours sampled from the mockups ---------- */
  .serif { color: #000215; }
  .page-title { color: #000; }
  .card .desc { color: #5f6d94; font-weight: 400; }
  .step-label { color: #3f4a68; }

  .call { color: #000; }

     Screens re-render on each tap, so the element that just changed gets anim-in / anim-out. */
  .anim-in .tick { animation: tick-in .2s ease; }
  .anim-in .tick svg { animation: pop-in .2s ease; }
  .anim-out .tick { animation: tick-out .2s ease; }

  @keyframes slot-out { from { background-color: #087596; border-color: #087596; color: #fff; } }

  @keyframes btn-off { from { opacity: 1; } }
  .month-next { animation: month-next .2s ease; }
  .month-prev { animation: month-prev .2s ease; }

  @keyframes month-prev { from { opacity: 0; transform: translateX(-18px); } }
  .invalid .err { animation: err-in .2s ease; }

  @keyframes err-in { from { opacity: 0; transform: translateY(-4px); } }
  @keyframes err-border { from { border-color: #a6d6e6; } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 1ms !important; transition-duration: 1ms !important; }

  @keyframes pop { from { transform: scale(.5); opacity: 0; } }
</style>

    const width = p => { const xs = p.match(/-?[\d.]+/g).filter((_, i) => i % 2 === 0).map(Number); return Math.max(...xs) - Math.min(...xs); };
    const check = parts.filter(p => width(p) < w * .7), ring = parts.filter(p => width(p) >= w * .7);
    return `<svg class="ic-success" width="${+(w * k).toFixed(2)}" height="${+(h * k).toFixed(2)}" viewBox="0 0 ${w} ${h}" aria-hidden="true">

  /* ---------- SimplyBook connection ----------

  const CFG = window.KITCO_BOOKING || {};

  const toMin = hms => { const [h, m] = hms.split(":").map(Number); return h * 60 + m; };
  const hms = m => `${String(Math.floor(m / 60)).padStart(2, "0")}:${String(m % 60).padStart(2, "0")}:00`;

  const live = (() => {
    let token = null, rpcId = 0;
    async function rpc(url, method, params, headers = {}) {
      const r = await fetch(url, {
        method: "POST", headers: { "Content-Type": "application/json", ...headers },
        body: JSON.stringify({ jsonrpc: "2.0", method, params, id: ++rpcId }),
      });
      const j = await r.json();
      if (j.error) throw new Error(j.error.message || "SimplyBook error");
      return j.result;
    }
    async function call(method, ...params) {
      if (!token) token = await rpc(API_URL + "/login", "getToken", [CFG.companyLogin, CFG.apiKey]);
      return rpc(API_URL, method, params, { "X-Company-Login": CFG.companyLogin, "X-Token": token });
    }
    const fieldCache = {};
    return {
      // { "2026-10-14": ["14:15:00", ...], ... }
      startTimes: (from, to, serviceId) => call("getStartTimeMatrix", from, to, serviceId, null, 1),
      async book(serviceId, date, time, client, answers) {
        // find this service's intake fields by their wording, so the answers land in the right place
        const fields = fieldCache[serviceId] || (fieldCache[serviceId] = await call("getAdditionalFields", serviceId));
        const pick = re => (Array.isArray(fields) ? fields : Object.values(fields || {})).find(f => re.test(f.title || ""))?.name;
        const additional = {};
        const put = (re, val) => { const n = pick(re); if (n && val !== "") additional[n] = val; };
        put(/estimated|estim/i, answers.value);
        put(/account|compte/i, answers.account);
        put(/prepare|visit|list|items/i, answers.notes);
        let unit = null;
        try {
          const units = await call("getAvailableUnits", serviceId, `${date} ${time}`, 1);
          if (Array.isArray(units) && units.length) unit = units[0];
        } catch (e) { /* let SimplyBook choose */ }
        return call("book", serviceId, unit, date, time, client, additional, 1);
      },
    };

  // Demo: weekdays, 15-minute steps from 10:00 to 16:00 (ending by 17:00), with a stable sprinkle of

  const demo = {
    async startTimes(from, to, serviceId) {
      await new Promise(r => setTimeout(r, shot ? 0 : 350));
      const dur = { 1: 30, 2: 30, 4: 60, 5: 60, 7: 120, 8: 120 }[serviceId] || 30;
      const out = {}, d = new Date(from + "T00:00:00"), end = new Date(to + "T00:00:00");
      const t = now(), nowMin = t.getHours() * 60 + t.getMinutes();
      for (; d <= end; d.setDate(d.getDate() + 1)) {
        if (d.getDay() % 6 === 0 || d < today()) continue;
        const list = [];
        for (let m = 600; m + dur <= 1020; m += 15) {
          const seed = (d.getDate() * 31 + m * 7 + serviceId * 13) % 10;
          if (seed < 3 && !shot) continue;                 // already taken
          if (sameDay(d, today()) && m <= nowMin + 30) continue;
          list.push(hms(m));
        }
        if (list.length) out[iso(d)] = list;
      }
      return out;
    },
    async book() {
      await new Promise(r => setTimeout(r, 700));
      return { bookings: [{ id: "DEMO-" + Date.now() }] };

  async function loadMonth(pickFirst = false) {
    const vm = state.viewMonth, sid = serviceId();

    Object.assign(avail, { key, days: {}, loading: true, error: false });
    render(false);
    const first = new Date(vm), last = new Date(vm.getFullYear(), vm.getMonth() + 1, 0);
    const from = first < today() ? today() : first;
    try {
      const days = from > last ? {} : await api.startTimes(iso(from), iso(last), sid);
      if (avail.key !== key) return;                       // the visitor moved on meanwhile
      avail.days = {};
      for (const [k, v] of Object.entries(days || {})) if (Array.isArray(v) && v.length) avail.days[k] = v.map(toMin);
      avail.loading = false;

          </div>
          <div class="cal-grid">
            ${t.dow.map(d => `<span class="dow">${d}</span>`).join("")}
            ${cells}
          </div>
        </div>
        </div><div class="col">
        ${avail.loading ? `<p class="slots-note">${t.loadingTimes}</p>`
          : avail.error ? `<p class="slots-note">${t.loadError} <button type="button" data-act="retry">${t.retry}</button></p>`
          : state.date && slotsFor(state.date).length ? `
          <h2 class="serif section">${lang === "fr" ? fmtLongDate(state.date).replace(/^./, c => c.toUpperCase()) : fmtLongDate(state.date)}</h2>
          <div class="slots ${slotsFor(state.date).length > 12 ? "many" : ""}">
            ${slotsFor(state.date).map(s => `<button class="slot ${state.time === s.m ? "on" : ""}" data-act="time" data-v="${s.m}" ${s.disabled ? "disabled" : ""}>${fmtTime(s.m)}</button>`).join("")}
          </div>` : `<p class="slots-note">${Object.keys(avail.days).length ? t.pickDay : t.noTimes}</p>`}
        </div></div>
        <div class="grow"></div>
        <button class="btn s2" data-act="next" ${state.date && state.time != null ? "" : "disabled"}>${t.cont}</button>
      </main>`;
  }

  function step3() {
    const t = T(), f = state.form, err = validate();
    const bad = k => state.showErrors && err[k] ? "invalid" : "";
    return `
      ${topbar()}
      <main class="view s3">
        <div class="step-head"><div class="step-left">
        ${progress(3)}
        ${backBtn("arrow2")}
        </div>
        <h1 class="serif title">${t.prepare}</h1>
        </div>
        <div class="cols"><div class="col">
        <form id="details" novalidate>
          <div class="field ${bad("name")}">
            <div class="box"><span class="lead">${vec("user")}</span><input name="name" autocomplete="name" placeholder="${t.namePh}" aria-label="${t.nameLbl}" value="${esc(f.name)}"></div>
            <div class="err">${err.name || ""}</div>
          </div>
          <div class="field ${bad("email")}">
            <div class="box"><span class="lead">${vec("mail")}</span><input name="email" type="email" inputmode="email" autocomplete="email" placeholder="${t.emailPh}" aria-label="${t.emailLbl}" value="${esc(f.email)}"></div>
            <div class="err">${err.email || ""}</div>
          </div>
          <div class="field ${bad("phone")}">
            <label class="label" for="phone">${t.phone}</label>
            <div class="box short">
              <span class="plus" aria-hidden="true">+</span><input class="cc" name="cc" type="tel" inputmode="numeric" autocomplete="tel-country-code" maxlength="4" aria-label="${t.ccLbl}" value="${esc(f.cc.slice(1))}"><span class="vsep"></span>
              <input id="phone" name="phone" type="tel" inputmode="tel" autocomplete="tel-national" placeholder="${f.cc === "+1" ? "(555) 123-4567" : t.phone}" value="${esc(f.phone)}">
            </div>
            <div class="err">${err.phone || ""}</div>
          </div>
          <div class="field pair-row">
          <div class="field ${bad("value")}">
            <label class="label" for="value">${t.value}</label>
            <div class="box shorter"><input id="value" name="value" inputmode="numeric" aria-label="${t.valueLbl}" value="${esc(f.value)}"></div>
            <div class="err">${err.value || ""}</div>
          </div>
          <div class="field ${bad("account")}">
            <span class="label">${t.account}</span>
            <div class="radios" role="radiogroup" aria-label="${t.account}">
              ${[["Yes", t.yes], ["No", t.no]].map(([v, label]) => `<label><input type="radio" name="account" value="${v}" ${f.account === v ? "checked" : ""}><span class="ring"></span>${label}</label>`).join("")}
            </div>
            <div class="err">${err.account || ""}</div>
          </div>
          </div>
          <div class="field gap">
            <label class="label" for="notes">${t.notesLbl}</label>
            <div class="box area"><textarea id="notes" name="notes" placeholder="${t.notesPh}">${esc(f.notes)}</textarea></div>
          </div>
        </form>
        </div><div class="col">

        <div class="summary">
          <div class="icon">${summaryIcon()}</div>
          <div>
            <div class="serif headline">${intentLabel()}<span class="sep">•</span>${fmtDuration(state.duration)}</div>
            <div class="row">${vec("cal", "#000")}${fmtLongDate(state.date, true)}</div>
            <div class="row">${vec("clock", "#000")}<span>${fmtRange(state.time, state.duration)}<span class="sep">•</span>${t.mtlTime}</span></div>
            <div class="row">${vec("pin", "#000")}${t.address}</div>
          </div>
        </div>

        <div class="checks">
          <div class="${bad("terms")}">
            <label><input type="checkbox" name="terms" ${f.terms ? "checked" : ""}><span class="sq">${icon.tick(12)}</span><span>${t.terms}</span></label>
            <div class="err" style="margin:-4px 0 10px">${err.terms || ""}</div>
          </div>
          <label><input type="checkbox" name="promos" ${f.promos ? "checked" : ""}><span class="sq">${icon.tick(12)}</span><span>${t.promos}</span></label>
        </div>

        <div class="call">${vec("phone", "#000")}<span>${t.call}</span></div>
        <button class="btn s3 ${state.sending ? "busy" : ""}" data-act="confirm" ${state.sending ? "disabled" : ""}>${state.sending ? t.booking : t.confirm}</button>
        ${state.bookError ? `<p class="book-error" role="alert">${t.bookError}</p>` : ""}
        </div></div>
      </main>`;
  }

  function step4() {
    const t = T();
    return `
      ${topbar()}
      <main class="view s4">
        ${progress(4)}
        <div class="done">
          ${successIcon()}
          <h1 class="serif">${t.success}</h1>
          ${t.thanks.map(x => `<p>${x}</p>`).join("")}
          <button class="btn s4" data-act="close">${t.close}</button>
        </div>
      </main>`;
  }

  function validate() {
    const t = T(), f = state.form, e = {};
    if (!f.name.trim()) e.name = t.eName;
    const ph = digits(f.phone), cc = digits(f.cc);
    if (!ph) e.phone = t.ePhone;
    else if (!cc || (cc === "1" ? ph.length !== 10 : ph.length < 6)) e.phone = t.ePhoneBad;
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(f.email.trim())) e.email = t.eEmail;
    const v = Number(digits(f.value));
    if (!v) e.value = t.eValue;
    if (!f.account) e.account = t.eAccount;
    if (!f.terms) e.terms = t.eTerms;
    return e;
  }

  async function submitBooking() {
    const f = state.form;
    state.sending = true; state.bookError = false; render(false);
    const notes = [state.buy && state.sell ? "Buy & Sell" : "", f.notes.trim()].filter(Boolean).join(" — ");
    try {
      const res = await api.book(serviceId(), iso(state.date), hms(state.time),
        { name: f.name.trim(), email: f.email.trim(), phone: digits(f.phone) ? `${f.cc} ${f.phone}` : "" },
        { value: digits(f.value), account: f.account || "", notes });
      if (!res || (Array.isArray(res.bookings) && !res.bookings.length)) throw new Error("No booking returned");
      state.sending = false; go(4);
    } catch (e) {
      console.error(e);
      state.sending = false; state.bookError = true; render(false);
    }
  }

  /* ---------- render & events ---------- */
  const key = el => el.dataset.act + ":" + el.dataset.v;
  function render(newStep = true) {
    // remember what was selected / enabled so the changes can be animated
    const wasOn = new Set([...app.querySelectorAll("[data-v].on")].map(key));
    const btnBefore = app.querySelector(".btn[data-act=next]")?.disabled;
    document.documentElement.lang = lang;
    document.title = T().docTitle;
    app.className = "app" + (state.step === 1 ? " has-topbar" : "") + (newStep ? "" : " still");
    app.innerHTML = [null, step1, step2, step3, step4][state.step]();
    if (!newStep) {
      app.querySelectorAll("[data-v]").forEach(el => {
        const on = el.classList.contains("on"), was = wasOn.has(key(el));
        if (on !== was) el.classList.add(on ? "anim-in" : "anim-out");
      });
      const btn = app.querySelector(".btn[data-act=next]");
      if (btn && btnBefore !== undefined && btn.disabled !== btnBefore) btn.classList.add(btn.disabled ? "disabling" : "enabling");
    }
    if (newStep) scroller.scrollTop = 0;
    fit();
  }

  // Every screen must fit without scrolling: if the content is taller than the screen,
  // scale the whole screen down just enough to fit.
  // Phones: size steps 1 and 3 so they reach just above the button (never past it).
  function fill() {
    const cols = app.querySelector("main.s1 .cols, main.s3 .cols");
    if (!cols) return;
    cols.style.setProperty("--k", 1);
    if (document.documentElement.classList.contains("shot") || !matchMedia("(max-width: 599px)").matches) return;
    const avail = scroller.clientHeight - 8;
    const need = () => { app.classList.add("measure"); const h = app.scrollHeight; app.classList.remove("measure"); return h; };
    // grow or shrink the content so it ends just above the button (bounded; fit() handles anything beyond)
    let lo = .7, hi = 1.5;
    for (let i = 0; i < 10; i++) {
      const mid = (lo + hi) / 2;
      cols.style.setProperty("--k", mid);
      if (need() <= avail) lo = mid; else hi = mid;
    }
    cols.style.setProperty("--k", lo);
  }

  // Desktop is designed at this width and scaled to the window, so it keeps the same proportions at any size.
  const DESIGN_W = 1306;
  function fit() {
    Object.assign(app.style, { transform: "", width: "", height: "", minHeight: "", marginRight: "", marginBottom: "" });
    fill();
    const avail = scroller.clientHeight, w = scroller.clientWidth;
    const measure = () => { app.classList.add("measure"); const h = app.scrollHeight; app.classList.remove("measure"); return h; };
    let z = 1;
    if (!document.documentElement.classList.contains("shot") && w >= 960) {
      // scale to the width; if that is too tall for the window, shrink further. A wider layout makes the
      // banner taller, so repeat until it settles.
      const main = app.querySelector("main");
      main.style.setProperty("--dk", 1);
      z = w / DESIGN_W;
      app.style.width = DESIGN_W + "px";
      // The card is always the same width; size its contents so the page fills the window height.
      // Step 1 is sized on its original layout, then its boxes are locked at those heights.
      const s1 = main.classList.contains("s1");
      let lo = s1 ? 1.18 : .75, hi = s1 ? 1.18 : 1.5;
      for (let i = 0; i < 12; i++) {
        const mid = (lo + hi) / 2;
        main.style.setProperty("--dk", mid);
        if (measure() * z <= avail) lo = mid; else hi = mid;
      }
      main.style.setProperty("--dk", lo);
      if (measure() * z > avail) {
        for (let i = 0; i < 6; i++) {
          app.style.width = w / z + "px";
          const need = measure();
          if (need * z <= avail + .5) break;
          z = avail / need;
        }
      }
      app.style.width = "";
    } else {
      const need = measure();
      if (need <= avail) { scroller.style.overflowY = ""; return; }
      z = avail / need;
    }
    Object.assign(app.style, {
      transform: `scale(${z})`, transformOrigin: "0 0",
      width: w / z + "px", height: avail / z + "px", minHeight: "0",
      marginRight: w - w / z + "px", marginBottom: avail - avail / z + "px",
    });
    scroller.style.overflowY = "hidden";
  }
  let lastSize = "";
  addEventListener("resize", () => {
    // ignore the on-screen keyboard opening while typing
    if (document.activeElement?.matches("input, textarea, select")) return;
    const size = innerWidth + "x" + innerHeight;
    if (size !== lastSize) { lastSize = size; fit(); }
  });

  // Prata is spaced differently from Bodoni 72; switch spacing when Bodoni 72 isn't on the device.
  function hasFamily(name) {
    const c = document.createElement("canvas").getContext("2d"), t = "Bookx & 72";
    c.font = "40px monospace"; const base = c.measureText(t).width;
    c.font = `40px "${name}", monospace`; return c.measureText(t).width !== base;
  }
  document.fonts.load('16px "Bodoni72"').catch(() => []).then(faces => {
    if (!faces.length && !hasFamily("Bodoni 72") && !hasFamily("Bodoni Svntytwo ITC Pro Book")) document.documentElement.classList.add("alt-serif");
    return document.fonts.ready;
  }).then(fit);
  function go(step) { state.step = step; render(); }

  app.addEventListener("click", e => {
    const el = e.target.closest("[data-act]");
    if (!el || el.disabled) return;
    const v = el.dataset.v;
    switch (el.dataset.act) {
      case "menu": openMenu(); break;
      case "intent": state[v] = !state[v]; render(false); break;
      case "lang":
        if (v !== lang) { lang = v; try { localStorage.setItem("lang", v); } catch (e) {} render(false); }
        break;
      case "duration": state.duration = Number(v); render(false); break;
      case "back": go(state.step - 1); break;
      case "next":
        if (state.step === 1) {
          // a new service may have different times: start from this month and the first open day
          const key = serviceId() + ":";
          if (!avail.key.startsWith(key) || !state.date) {
            state.date = null; state.time = null;
            const t0 = today();
            state.viewMonth = new Date(t0.getFullYear(), t0.getMonth(), 1);
            avail.key = "";
            go(2);
            loadMonth(true);
            break;
          }
        }
        go(state.step + 1); break;
      case "retry": avail.key = ""; loadMonth(!state.date); break;
      case "month": {
        const m = state.viewMonth;
        state.viewMonth = new Date(m.getFullYear(), m.getMonth() + Number(v), 1);
        render(false);
        loadMonth();                       // shows the loading state right away
        app.querySelectorAll(".cal-head h3, .cal-grid").forEach(el => el.classList.add(Number(v) > 0 ? "month-next" : "month-prev"));
        break;
      }
      case "date": state.date = new Date(Number(v)); state.time = null; render(false); break;
      case "time": state.time = Number(v); render(false); break;
      case "confirm":
        if (Object.keys(validate()).length) {
          state.showErrors = true;
          render(false);
          app.querySelector(".invalid")?.scrollIntoView({ behavior: "smooth", block: "center" });
          return;
        }
        submitBooking(); break;
      case "close": location.href = KITCO + "/"; break;
    }
  });

  // Form fields update state in place; errors clear as soon as a field becomes valid.
  app.addEventListener("input", e => {
    const t = e.target, f = state.form;
    if (!t.name || !(t.name in f)) return;
    if (t.type === "checkbox") f[t.name] = t.checked;
    else if (t.type === "radio") f[t.name] = t.value;
    else if (t.name === "cc") {
      // digits only after the fixed "+"; reformat the number for the new code without re-rendering (keeps focus)
      t.value = digits(t.value).slice(0, 4);
      f.cc = "+" + t.value;
      const ph = app.querySelector("[name=phone]");
      f.phone = ph.value = fmtPhone(f.phone, f.cc);
      ph.placeholder = f.cc === "+1" ? "(555) 123-4567" : "Phone number";
    }
    else if (t.name === "phone") { f.phone = fmtPhone(t.value, f.cc); t.value = f.phone; }
    else if (t.name === "value") { f.value = fmtMoney(t.value); t.value = f.value; }
    else f[t.name] = t.value;

    if (state.showErrors) {
      const err = validate();
      app.querySelectorAll(".invalid").forEach(box => {
        const inp = box.querySelector("input, textarea");
        const names = [...box.querySelectorAll("input, textarea")].map(i => i.name === "cc" ? "phone" : i.name);
        if (inp && !names.some(n => n in err)) box.classList.remove("invalid");
      });
    }
  });
  app.addEventListener("submit", e => e.preventDefault());

  document.getElementById("demo-badge").hidden = !(DEMO && !shot);
  if (shot) {
    document.documentElement.classList.add("shot");
    if (!new URLSearchParams(location.search).get("lang")) lang = "en";
    if (shot > 1) {
      Object.assign(state, { step: shot, buy: true, duration: 30, date: new Date(2026, 9, 20), viewMonth: new Date(2026, 9, 1), time: 600 });
      loadMonth();
    }
  }
  render();
})();
</script>
</body>
</html>
